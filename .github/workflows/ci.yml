name: CI

# Docs-only changes skip CI. It is a denylist (paths-ignore, not paths), so new
# code paths are checked by default.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE", "deploy/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE", "deploy/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      # Run the checks through the flake devShell so CI and local dev share one
      # toolchain (no dtolnay/rust-cache drift).
      - name: Format
        run: nix develop -c cargo fmt --check
      - name: Clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo test

      # Gate on the flake package + image building reproducibly.
      - name: Nix build (binary)
        run: nix build .#default
      - name: Nix build (image)
        run: nix build .#image

      # Chart docs must be regenerated from values.yaml before committing.
      - name: helm-docs verify
        run: |
          nix develop -c helm-docs --chart-search-root=charts
          git diff --exit-code charts/coredrop/README.md
      - name: helm lint
        run: nix develop -c helm lint charts/coredrop
      # The optional PodMonitor must render too, the dashboard must be the
      # output of its generator, and the alert rules must load.
      - name: helm template (PodMonitor) + dashboard JSON
        run: |
          nix develop -c helm template coredrop charts/coredrop \
            --set metrics.podMonitor.enabled=true >/dev/null
          nix develop -c jq empty dashboards/coredrop.json
          nix develop -c sh -c 'python3 dashboards/generate.py | diff -u dashboards/coredrop.json -'
      - name: promtool check rules
        run: nix develop -c promtool check rules alerts/coredrop.rules.yaml
