name: Release

# Two independent tag prefixes:
#   app-v<ver>   -> build + push the multi-arch image ghcr.io/gabrielopesantos/coredrop:<ver>
#                   (+ latest, unless <ver> is a pre-release such as 1.1.0-rc1)
#   chart-v<ver> -> package + push the chart to oci://ghcr.io/gabrielopesantos/charts
# <ver> must equal the version in Cargo.toml (app) or Chart.yaml (chart), and
# the chart's appVersion image must exist. Bump them in a commit first.
on:
  push:
    tags:
      - "app-v*"
      - "chart-v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gabrielopesantos/coredrop
  CHART_REPO: oci://ghcr.io/gabrielopesantos/charts

jobs:
  # --- image: native per-arch build, then a merged manifest list --------------
  check-app-version:
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Guard tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VER="${TAG#app-v}"
          CARGO_VER="$(nix develop -c yq -p toml '.package.version' Cargo.toml)"
          if [ "$TAG_VER" != "$CARGO_VER" ]; then
            echo "tag $TAG_VER != Cargo.toml version $CARGO_VER" >&2
            exit 1
          fi

  build-image:
    needs: check-app-version
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build image (native arch)
        run: nix build .#image
      - name: Push per-arch image
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION#app-v}"
          printf '%s' "$GH_TOKEN" | nix develop -c skopeo login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          nix develop -c skopeo copy \
            "docker-archive:$(readlink -f result)" \
            "docker://${IMAGE}:${VERSION}-${{ matrix.arch }}"

  push-manifest:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Assemble multi-arch manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#app-v}"
          tags=(-t "${IMAGE}:${VERSION}")
          # A pre-release (a `-` in the version) does not move latest.
          case "$VERSION" in
            *-*) ;;
            *) tags+=(-t "${IMAGE}:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"

  # --- chart: package from Chart.yaml as committed, push to OCI ---------------
  publish-chart:
    if: startsWith(github.ref, 'refs/tags/chart-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Guard tag matches Chart.yaml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VER="${TAG#chart-v}"
          CHART_VER="$(nix develop -c yq '.version' charts/coredrop/Chart.yaml)"
          if [ "$TAG_VER" != "$CHART_VER" ]; then
            echo "tag $TAG_VER != Chart.yaml version $CHART_VER" >&2
            exit 1
          fi
      # The chart's default image tag must exist, or a default install
      # pulls nothing.
      - name: Guard appVersion image exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER="$(nix develop -c yq '.appVersion' charts/coredrop/Chart.yaml)"
          printf '%s' "$GH_TOKEN" | nix develop -c skopeo login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          if ! nix develop -c skopeo inspect --raw "docker://${IMAGE}:${APP_VER}" >/dev/null; then
            echo "image ${IMAGE}:${APP_VER} (Chart.yaml appVersion) does not exist; push app-v${APP_VER} first" >&2
            exit 1
          fi
      - name: Package and push chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | nix develop -c helm registry login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          nix develop -c helm package charts/coredrop
          nix develop -c helm push coredrop-*.tgz "${CHART_REPO}"
