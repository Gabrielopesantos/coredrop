[package]
name = "coredrop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone Kubernetes coredump handler: captures fault cores + proc snapshots to object storage with JSON manifest sidecars."

[[bin]]
name = "coredrop"
path = "src/main.rs"

[lib]
name = "coredrop"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
    "fs",
    "process",
    "time",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The daemon's config file (YAML); maintained fork of serde_yaml
serde_norway = "0.9.42"

# In-memory tar of the pre-reap /proc snapshot
tar = "0.4"

# Core upload: stream core fd -> zstd -> sha256 -> object store, never buffering
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
sha2 = "0.11"
url = "2"

# CLI config: flags, with config-file values as their defaults. `string`
# lets those defaults be built at runtime. Secrets (store creds) stay env-only.
clap = { version = "4", features = ["derive", "env", "string"] }

# Timestamp formatting in manifest (RFC3339)
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Prometheus `/metrics` endpoint. hyper, hyper-util and http-body-util are
# already transitive via reqwest; only the server features are new.
prometheus-client = "0.25"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"

# flock for the rate-limit state file, statvfs for the spool free-space check,
# and dup2 to release the kernel's core pipe (already transitive via tar -> xattr)
rustix = { version = "1", features = ["fs", "stdio"] }

# Hand-rolled Kubernetes Event client (daemon side only): already transitive
# via object_store, so the dep tree barely moves.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }

# Errors
anyhow = "1"

# async trait for CaptureBackend
async-trait = "0.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
object_store = { version = "0.14" }
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
async-trait = "0.1"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "test-util",
] }
tempfile = "3"
