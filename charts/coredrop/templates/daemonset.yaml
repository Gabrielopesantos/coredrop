{{- include "coredrop.validateStoreOpts" . }}
{{- include "coredrop.validateSpool" . }}
{{- include "coredrop.validateUpload" . }}
{{- $criUnixSocket := "" }}
{{- if hasPrefix "unix://" .Values.cri.runtimeEndpoint }}
{{- $criUnixSocket = clean (trimPrefix "unix://" .Values.cri.runtimeEndpoint) }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "coredrop.fullname" . }}
  labels:
    {{- include "coredrop.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "coredrop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
      labels:
        {{- include "coredrop.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "coredrop.serviceAccountName" . }}
      # The daemon keeps uploading the spool for shutdownFlushSeconds after
      # SIGTERM; the margin covers restoring core_pattern and exiting.
      terminationGracePeriodSeconds: {{ add .Values.upload.shutdownFlushSeconds 5 }}
      automountServiceAccountToken: {{ .Values.events.enabled }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Install the coredrop binary to a hostPath before the daemon starts.
      # The kernel exec's the handler in the host mount namespace, so the binary
      # must live on a hostPath the handler can reach from host namespaces.
      initContainers:
        - name: install-handler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Root writes into a root-owned hostPath directory: no capability needed.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - install -m 0755 /bin/coredrop {{ .Values.corePattern.hostBinDir }}/coredrop
          volumeMounts:
            - name: host-bin
              mountPath: {{ .Values.corePattern.hostBinDir }}
      containers:
        - name: coredrop
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            # Node name for k8s Events. The pod hostname is the pod name.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # corePattern: how the kernel is wired to the handler.
            - name: CAPTURE_HANDLER_PATH
              value: "{{ .Values.corePattern.hostBinDir }}/coredrop"
            - name: CAPTURE_CONFIG_PATH
              value: "{{ .Values.corePattern.hostRunDir }}/handler.json"
            - name: CAPTURE_PIPE_LIMIT
              value: {{ .Values.corePattern.pipeLimit | quote }}
            # The node's sysctl files, bind-mounted writable (see volumeMounts).
            - name: CAPTURE_CORE_PATTERN_PATH
              value: "/host/sysctl/core_pattern"
            - name: CAPTURE_CORE_PIPE_LIMIT_PATH
              value: "/host/sysctl/core_pipe_limit"
            # capture: what happens once the handler captures a crash.
            - name: CAPTURE_CLUSTER
              value: {{ .Values.capture.cluster | quote }}
            {{- if .Values.capture.noRedact }}
            - name: CAPTURE_NO_REDACT
              value: "true"
            {{- end }}
            - name: CAPTURE_MAX_CORE_SIZE
              value: {{ include "coredrop.size" (dict "name" "capture.maxCoreSize" "value" .Values.capture.maxCoreSize) | quote }}
            - name: CAPTURE_MAX_CORES_PER_HOUR
              value: {{ .Values.capture.maxCoresPerHour | quote }}
            - name: CAPTURE_DRAIN_DEADLINE_SECS
              value: {{ .Values.capture.drainDeadlineSeconds | quote }}
            - name: CRICTL_TIMEOUT_SECS
              value: {{ .Values.capture.crictlTimeoutSeconds | quote }}
            {{- with .Values.capture.filter }}
            {{- if or .include .exclude }}
            - name: CAPTURE_FILTER
              value: {{ dict "include" (.include | default list) "exclude" (.exclude | default list) | toJson | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.capture.objectStore.url }}
            - name: CAPTURE_STORE_URL
              value: {{ .Values.capture.objectStore.url | quote }}
            {{- range $key, $value := .Values.capture.objectStore.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            # spool + upload: the handler writes the spool, the daemon uploads it.
            - name: CAPTURE_SPOOL_DIR
              value: {{ .Values.spool.hostDir | quote }}
            - name: CAPTURE_SPOOL_MAX_SIZE
              value: {{ include "coredrop.size" (dict "name" "spool.maxSize" "value" .Values.spool.maxSize) | quote }}
            - name: CAPTURE_SPOOL_MIN_FREE_PERCENT
              value: {{ .Values.spool.minFreePercent | quote }}
            - name: CAPTURE_SPOOL_MAX_AGE_SECS
              value: {{ .Values.spool.maxAgeSeconds | int64 | quote }}
            - name: CAPTURE_UPLOAD_CONCURRENCY
              value: {{ .Values.upload.concurrency | quote }}
            - name: CAPTURE_UPLOAD_TIMEOUT_SECS
              value: {{ .Values.upload.timeoutSeconds | quote }}
            - name: CAPTURE_SHUTDOWN_FLUSH_SECS
              value: {{ .Values.upload.shutdownFlushSeconds | quote }}
            {{- if not .Values.events.enabled }}
            - name: CAPTURE_NO_EVENTS
              value: "true"
            {{- end }}
            # metrics: the Prometheus endpoint; empty turns it off.
            - name: CAPTURE_METRICS_ADDR
              value: {{ ternary (printf "0.0.0.0:%v" .Values.metrics.port) "" .Values.metrics.enabled | quote }}
            # cri: post-drain container identity enrichment.
            - name: CRICTL_PATH
              value: {{ .Values.cri.crictlPath | quote }}
            {{- with .Values.cri.runtimeEndpoint }}
            - name: CONTAINER_RUNTIME_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
          {{- if and .Values.capture.objectStore.url .Values.capture.objectStore.credentials }}
          envFrom:
            - secretRef:
                name: {{ include "coredrop.fullname" . }}-store
          {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          # Probes exec `coredrop check`: the kernel still routes cores to
          # our handler, the handler config is intact, the event socket is
          # bound.
          readinessProbe:
            exec:
              command: ["/bin/coredrop", "check"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/coredrop", "check"]
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # hostPath for the daemon-written handler config and the handler binary
            # install dir (the handler reads the config path from here).
            - name: host-run
              mountPath: {{ .Values.corePattern.hostRunDir }}
            # The spool, at its host path: the handler writes host paths, and
            # the daemon reads the same paths here.
            - name: host-spool
              mountPath: {{ .Values.spool.hostDir | quote }}
            # Only these two sysctls are writable. The container's own /proc/sys
            # stays read-only. The mount point is outside /proc: the runtime
            # refuses most mounts under it.
            - name: host-core-pattern
              mountPath: /host/sysctl/core_pattern
            - name: host-core-pipe-limit
              mountPath: /host/sysctl/core_pipe_limit
            {{- if $criUnixSocket }}
            # CRI socket for crictl enrichment (post-drain, best-effort).
            - name: cri-socket
              mountPath: {{ $criUnixSocket }}
              readOnly: true
            {{- end }}
      volumes:
        - name: host-bin
          hostPath:
            path: {{ .Values.corePattern.hostBinDir }}
            type: DirectoryOrCreate
        - name: host-run
          hostPath:
            path: {{ .Values.corePattern.hostRunDir }}
            type: DirectoryOrCreate
        - name: host-spool
          hostPath:
            path: {{ .Values.spool.hostDir | quote }}
            type: DirectoryOrCreate
        - name: host-core-pattern
          hostPath:
            path: /proc/sys/kernel/core_pattern
            type: File
        - name: host-core-pipe-limit
          hostPath:
            path: /proc/sys/kernel/core_pipe_limit
            type: File
        {{- if $criUnixSocket }}
        - name: cri-socket
          hostPath:
            path: {{ $criUnixSocket }}
            type: Socket
        {{- end }}
