{{- $binDir := clean .Values.corePattern.hostBinDir }}
{{- /* Fixed: the kernel-exec'd handler reads its config only here. */}}
{{- $runDir := "/run/coredrop" }}
{{- $spoolDir := clean .Values.spool.hostDir }}
{{- $criUnixSocket := "" }}
{{- if hasPrefix "unix://" .Values.cri.runtimeEndpoint }}
{{- $criUnixSocket = clean (trimPrefix "unix://" .Values.cri.runtimeEndpoint) }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "coredrop.fullname" . }}
  labels:
    {{- include "coredrop.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "coredrop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # A config change rolls the DaemonSet: the daemon reads the file
        # only at startup.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # The store credentials reach the daemon as env, read at startup.
        checksum/store: {{ include (print $.Template.BasePath "/store-secret.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
      labels:
        {{- include "coredrop.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "coredrop.serviceAccountName" . }}
      # The daemon keeps uploading the spool for shutdownFlushSeconds after
      # SIGTERM; the margin covers restoring core_pattern and exiting.
      terminationGracePeriodSeconds: {{ add .Values.upload.shutdownFlushSeconds 10 }}
      automountServiceAccountToken: {{ .Values.events.enabled }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Install the coredrop binary to a hostPath before the daemon starts.
      # The kernel exec's the handler in the host mount namespace, so the binary
      # must live on a hostPath the handler can reach from host namespaces.
      initContainers:
        - name: install-handler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Root writes into a root-owned hostPath directory: no capability needed.
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The path reaches the script as an environment variable, never as
          # script text, so no character in it is shell syntax.
          env:
            - name: BIN_DIR
              value: {{ $binDir | quote }}
          command:
            - sh
            - -c
            - install -m 0755 /bin/coredrop "$BIN_DIR/coredrop"
          volumeMounts:
            - name: host-bin
              mountPath: {{ $binDir | quote }}
      containers:
        - name: coredrop
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Every daemon setting is in the config file (configmap.yaml), except
          # the node name, which only the downward API knows. Kubernetes
          # expands $(NODE_NAME) from the env below. Env holds only what the
          # file must not or cannot hold.
          args: ["--config", "/etc/coredrop/config.yaml", "--node-name=$(NODE_NAME)"]
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            # Node name for k8s Events. The pod hostname is the pod name.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Object-store client options; the client reads them from env.
            {{- if .Values.capture.objectStore.url }}
            {{- range $key, $value := .Values.capture.objectStore.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- if and .Values.capture.objectStore.url .Values.capture.objectStore.credentials }}
          envFrom:
            - secretRef:
                name: {{ include "coredrop.fullname" . }}-store
          {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          # Probes exec `coredrop check`: the kernel still routes cores to
          # our handler, the handler config is intact, the event socket is
          # bound.
          readinessProbe:
            exec:
              command: ["/bin/coredrop", "check", "--config", "/etc/coredrop/config.yaml"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/coredrop", "check", "--config", "/etc/coredrop/config.yaml"]
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # subPath: the file stays fixed for the pod's life. A directory
            # mount gets ConfigMap updates, so during a rollout an old pod's
            # probe would check the new config against the old daemon. A
            # config change rolls the pods through checksum/config instead.
            - name: config
              mountPath: /etc/coredrop/config.yaml
              subPath: config.yaml
              readOnly: true
            # hostPath for the daemon-written handler config, events.sock and the
            # rate-limit state. The handler reads its config from this fixed path.
            - name: host-run
              mountPath: {{ $runDir | quote }}
            # The spool, at its host path: the handler writes host paths, and
            # the daemon reads the same paths here.
            - name: host-spool
              mountPath: {{ $spoolDir | quote }}
            # Only these two sysctls are writable. The container's own /proc/sys
            # stays read-only. The mount point is outside /proc: the runtime
            # refuses most mounts under it.
            - name: host-core-pattern
              mountPath: /host/sysctl/core_pattern
            - name: host-core-pipe-limit
              mountPath: /host/sysctl/core_pipe_limit
            {{- if $criUnixSocket }}
            # CRI socket for crictl enrichment (post-drain, best-effort).
            - name: cri-socket
              mountPath: {{ $criUnixSocket | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "coredrop.fullname" . }}-config
        - name: host-bin
          hostPath:
            path: {{ $binDir | quote }}
            type: DirectoryOrCreate
        - name: host-run
          hostPath:
            path: {{ $runDir | quote }}
            type: DirectoryOrCreate
        - name: host-spool
          hostPath:
            path: {{ $spoolDir | quote }}
            type: DirectoryOrCreate
        - name: host-core-pattern
          hostPath:
            path: /proc/sys/kernel/core_pattern
            type: File
        - name: host-core-pipe-limit
          hostPath:
            path: /proc/sys/kernel/core_pipe_limit
            type: File
        {{- if $criUnixSocket }}
        - name: cri-socket
          hostPath:
            path: {{ $criUnixSocket | quote }}
            type: Socket
        {{- end }}
