# -- Override the chart name segment of resource names.
nameOverride: ""
# -- Override the full generated name of chart resources.
fullnameOverride: ""

image:
  # -- Container image repository (published on `app-v*` tags).
  repository: ghcr.io/gabrielopesantos/coredrop
  # -- Image tag; empty defaults to `.Chart.AppVersion`.
  tag: "" # defaults to .Chart.AppVersion
  # -- Image pull policy.
  pullPolicy: IfNotPresent

serviceAccount:
  # For cloud workload identity (IRSA/GKE WI/AKS WI), annotate here and
  # leave objectStore credentials empty.
  # -- Annotations on the daemon's ServiceAccount (e.g. cloud workload identity).
  annotations: {}

# The daemon writes core_pattern and core_pipe_limit through two bind-mounted
# sysctl files, so it needs no capabilities. Root is still required: the
# kernel allows a sysctl write only from uid 0 in the host user namespace.
# SELinux nodes may also need `seLinuxOptions: {type: spc_t}`.
# -- Daemon container securityContext.
securityContext:
  runAsUser: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# How the daemon wires itself into the kernel and host: installs the handler
# binary to a hostPath, points core_pattern at it, and raises core_pipe_limit
# so the kernel holds a crash open long enough for the handler to read it.
# The kernel exec's the handler in host namespaces with a clean environment,
# so it reads the hostRunDir config file the daemon wrote, not env vars.
corePattern:
  # Node-global sysctl: max crashes concurrently held open for the handler.
  # Beyond it the kernel skips the dump (the handler is not exec'd); it does
  # not queue.
  # -- `core_pipe_limit` sysctl the daemon installs alongside `core_pattern`.
  pipeLimit: 128
  # -- Host path the handler binary is installed to (resolved in the host mount ns).
  hostBinDir: "/opt/coredrop/bin"
  # -- Host path for the handler config and rate-limit state.
  hostRunDir: "/run/coredrop"

# The node-local spool. The handler writes each capture (core, /proc snapshot,
# manifest) here and exits; the daemon uploads the spool to the object store.
# The spool must be on disk, not tmpfs: /run is RAM. The daemon does not start
# when hostDir is on tmpfs or ramfs. The spool shares the node's
# filesystem with the kubelet, which evicts pods under disk pressure, so keep
# maxSize and minFreePercent conservative.
spool:
  # -- Host path of the spool. Use a directory for coredrop only: the handler creates `incoming/` and `ready/` in it, and `helm uninstall` deletes them.
  hostDir: "/var/lib/coredrop/spool"
  # -- Cap on the spool's total size, as a Kubernetes quantity (`10Gi`, `500M`) or a byte count. Only core writes check it: a core that does not fit is dropped or truncated, and snapshots and manifests are still written. `0` = no cap.
  maxSize: 10Gi
  # -- Free-space floor of the spool's filesystem, in percent; below it cores are dropped.
  minFreePercent: 15
  # -- Age in seconds past which a capture that still fails to upload is deleted (7 days default).
  maxAgeSeconds: 604800

# How the daemon uploads the spool.
upload:
  # -- Captures uploaded at the same time.
  concurrency: 2
  # -- Time limit in seconds for one upload attempt of one capture; it is retried after. `0` = no limit.
  timeoutSeconds: 600
  # -- On pod shutdown, seconds the daemon keeps uploading the spool. The pod's termination grace period is this plus 5.
  shutdownFlushSeconds: 25

# What happens to a crash once the handler captures it: where it's counted
# against, how much of it is kept, and where it's uploaded.
capture:
  # -- Cluster name - the first segment of every object key.
  cluster: "local"
  # -- Truncate stored cores at this size, as a Kubernetes quantity (`2Gi`, `500M`) or a byte count. `0` = no limit.
  maxCoreSize: 2Gi
  # -- Per-pod core upload budget per hour; excess crashes keep manifest + snapshot only.
  maxCoresPerHour: 3
  # -- Deadline in seconds for the handler to write a core into the spool; past it the core is dropped, and the snapshot and manifest are still spooled. `0` disables.
  drainDeadlineSeconds: 60
  # -- Timeout in seconds for `crictl inspect` in the handler; `0` = no timeout.
  crictlTimeoutSeconds: 10
  # -- Pass `environ` and `cmdline` through un-redacted. Leave false; cores are secret-bearing.
  noRedact: false
  # Which crashes are captured. Each entry holds glob patterns (`*`, `?`) for
  # `namespace`, `pod`, `container`, `image` and `exe` (executable path, e.g.
  # `*/server`); all patterns of one entry must match. A crash is captured
  # when it matches an `include` entry (or `include` is empty) and no
  # `exclude` entry. A filtered crash is not read: no core, no snapshot, no
  # manifest, no Event; it is only logged. A filter on namespace,
  # pod, container or image runs crictl before the core is read, with a
  # timeout of `crictlTimeoutSeconds` but 10 s at most; when crictl fails,
  # the crash is captured.
  filter:
    # -- Capture only crashes that match one of these entries; empty captures all. Example: `[{namespace: "team-*"}]`.
    include: []
    # -- Never capture crashes that match one of these entries; wins over `include`. Example: `[{namespace: kube-system}, {container: istio-proxy}]`.
    exclude: []
  # S3-compatible/GCS/Azure object store the daemon uploads the core +
  # proc-snapshot + manifest to. Only the daemon pod gets these settings and
  # credentials; the handler never does. Leave `url` empty to run
  # observe-only: crashes are logged and reported as Events, and nothing is
  # written to the spool.
  # Both maps below take allowlisted keys only (listed in the chart README); an
  # unknown key fails chart rendering with the valid set rather than being
  # dropped silently at runtime.
  objectStore:
    # -- Object store URL (`s3://bucket`, `gs://bucket` or `az://container`); empty disables upload.
    url: ""
    # Non-secret client options, rendered as plain env vars on the daemon.
    # An `http://` endpoint (with `AWS_ALLOW_HTTP`) sends cores - and whatever
    # secrets their memory holds - across the network unencrypted; use it for
    # in-cluster/dev stores only. The daemon logs a warning at startup when it
    # sees one.
    # -- Non-secret object-store client options, rendered as plain env vars (allowlisted).
    config: {}
    #   AWS_REGION: "us-east-1"
    #   AWS_ENDPOINT: "http://minio:9000"   # S3-compatible, e.g. in-cluster MinIO
    #   AWS_ALLOW_HTTP: "true"              # plaintext endpoint, dev only
    # Secret-bearing options; rendered into the store Secret and injected via
    # envFrom. Leave empty for workload identity (annotate serviceAccount instead).
    # -- Secret-bearing object-store options, rendered into a Secret and injected via envFrom (allowlisted).
    credentials: {}
    #   AWS_ACCESS_KEY_ID: ""
    #   AWS_SECRET_ACCESS_KEY: ""

# CRI socket for crictl enrichment (post-drain identity: namespace, pod name,
# container name, image, restart count).
#
# Empty by default: the handler runs in the host mount namespace, so the
# node's own crictl resolves the endpoint from /etc/crictl.yaml and its
# built-in fallbacks (containerd, CRI-O, cri-dockerd).
cri:
  # -- CRI endpoint for crictl enrichment; when set, its `unix://` path is also the socket mounted from the host. Empty lets crictl self-resolve on the node.
  runtimeEndpoint: ""
  # Path to crictl ON THE NODE: the kernel-exec'd handler runs in the host
  # mount namespace and shells out to the node's own crictl (k3s and most
  # kubeadm nodes install it here), not a binary from this image.
  # -- Path to the crictl binary on the node (host mount ns), for the handler's enrichment.
  crictlPath: "/usr/local/bin/crictl"

# Post-delete hook that removes the handler binary, runtime config/state, and
# hostPath directories from every node on `helm uninstall`.
cleanup:
  # -- Run the post-delete cleanup DaemonSet on `helm uninstall`.
  enabled: true
  # -- Image for the post-delete cleanup Job that drives the cleanup DaemonSet via kubectl.
  image: "rancher/kubectl:v1.35.6"

# k8s Event emission on capture: posts an event on the crashing pod
# ("core dumped, artifacts at {key}") so kubectl describe pod/kubectl get
# events surfaces it. Disabling skips the events RBAC
# (ClusterRole/ClusterRoleBinding) and the ServiceAccount token mount
# (automountServiceAccountToken: false). The daemon still logs every capture.
events:
  # -- Post a k8s Event on the crashing pod per capture; `false` also skips the events RBAC.
  enabled: true

# Prometheus metrics on the daemon pod: capture outcomes, upload attempts,
# spool size, Event posts. Labels hold bounded values only, never pod names.
metrics:
  # -- Serve `/metrics` on the daemon pod and add the `prometheus.io/*` scrape annotations.
  enabled: true
  # -- Container port of the `/metrics` endpoint.
  port: 9464
  podMonitor:
    # -- Render a Prometheus Operator `PodMonitor` for the daemon pods (needs the `monitoring.coreos.com` CRDs).
    enabled: false
    # -- Scrape interval; empty uses the Prometheus default.
    interval: ""
    # -- Extra labels on the `PodMonitor`, for a Prometheus `podMonitorSelector`.
    labels: {}

# -- `RUST_LOG` filter for the daemon.
logLevel: info

# -- DaemonSet resource requests/limits.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Pod tolerations (defaults to tolerating everything so it runs on all nodes).
tolerations:
  - operator: Exists

# -- Pod node selector.
nodeSelector: {}

# Merged onto the DaemonSet pod template's labels. Needed for AKS workload
# identity, whose webhook only injects credentials into pods carrying
# azure.workload.identity/use: "true" - see the chart README's "Workload
# identity" section.
# -- Extra labels merged onto the daemon pod template.
podLabels: {}
